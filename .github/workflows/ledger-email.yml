name: KeepClarity Fortnightly Ledger Email

on:
  schedule:
    # Every Thursday at 12:00 UTC = 10:00pm AEST (Sydney, UTC+10).
    # Sydney switches to AEDT (UTC+11) for daylight saving (roughly
    # early Oct to early Apr) — during that window change this to
    # "0 11 * * 4" so it still lands at 10pm local time.
    - cron: "0 12 * * 4"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

jobs:
  send-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send fortnightly ledger email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python send_ledger_email.py --force
          else
            python send_ledger_email.py
          fi
